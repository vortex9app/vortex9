name: Build Capacitor iOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: capacitor-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: iOS app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Install Capacitor iOS dependencies
        run: npx cap sync ios

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Compile the iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload the compiled app
        uses: actions/upload-artifact@v4
        with:
          name: mystic9-ios-simulator
          path: ios/DerivedData/Build/Products/Release-iphonesimulator/App.app
          if-no-files-found: error
