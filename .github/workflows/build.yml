name: Build Vortex9 installers

on:
  push:
    branches:
      - main
    tags:
      - "*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vortex9-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows installers
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop/vortex9
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/vortex9/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Package Windows installers
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: vortex9-windows
          path: |
            release/Vortex9-Windows-Setup.exe
            release/Vortex9-Windows-Setup.zip
          if-no-files-found: error

  build-macos:
    name: macOS installers
    needs: build-windows
    if: always() && needs.build-windows.result != 'cancelled'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop/vortex9
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/vortex9/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Package macOS installers
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: vortex9-macos
          path: |
            release/Vortex9-macOS-Installer.dmg
            release/Vortex9-macOS-Installer.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos
    if: always() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          files=(release-assets/*.exe release-assets/*.zip release-assets/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer files were downloaded."
            exit 1
          fi
          if [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$(node -p "require('./desktop/vortex9/package.json').version")"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --notes "Vortex9 desktop installers for Windows and macOS."
          fi
